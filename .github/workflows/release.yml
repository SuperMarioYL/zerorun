name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build wheel + sdist into dist/
        run: python -m build
      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > checksums.txt
          cat checksums.txt
      - name: Upload dist/ as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
      # Attach the built wheel/sdist/checksums to the GitHub Release so a
      # released version is downloadable (the workflow artifact above expires
      # and is not part of the Release). Idempotent by design: the tag push
      # precedes the release creation, so create it here only if it is still
      # missing, and --clobber tolerates assets already uploaded by a local
      # `dist/` publish.
      - name: Attach dist/ to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "${GITHUB_REPOSITORY#*/} $GITHUB_REF_NAME" --generate-notes \
            || true
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*

  # OPTIONAL PyPI publish — off by default. A fresh repo has no PyPI Trusted
  # Publisher registered, so an always-on job would fail the FIRST release with
  # `invalid-publisher` and leave a red ✗. Gate it behind the PYPI_PUBLISH repo
  # variable; the user sets that + registers the Trusted Publisher when ready.
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
