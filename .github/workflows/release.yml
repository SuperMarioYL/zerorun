name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build wheel + sdist into dist/
        run: python -m build
      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > checksums.txt
          cat checksums.txt
      - name: Upload dist/ as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  # OPTIONAL PyPI publish — off by default. A fresh repo has no PyPI Trusted
  # Publisher registered, so an always-on job would fail the FIRST release with
  # `invalid-publisher` and leave a red ✗. Gate it behind the PYPI_PUBLISH repo
  # variable; the user sets that + registers the Trusted Publisher when ready.
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
