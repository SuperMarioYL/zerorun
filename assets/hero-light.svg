<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif"
     role="img" aria-label="ZeroRun — probe your GPU, pick quant+backend+template, just run it">
  <defs>
    <!-- Flowing gradient sweep on the title (infinite loop). The sweep window
         (x1..x2) keeps a constant width and starts/ends fully off the text bbox
         (s=0 window [-220%,-100%], s=1 window [100%,220%]); both boundary
         frames render the title in the pad colour #5E5CE6, so the loop seam is
         pixel-identical. AI/agent domain palette: purple pad + teal band. -->
    <linearGradient id="hg" x1="-220%" y1="0%" x2="-100%" y2="0%">
      <stop offset="0%"   stop-color="#5E5CE6"/>
      <stop offset="50%"  stop-color="#10A37F"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
      <animate attributeName="x1" values="-220%;100%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-100%;220%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="880" height="300" fill="#F5F5F7"/>
  <text x="440" y="150" text-anchor="middle" font-size="56" font-weight="700" fill="url(#hg)">ZeroRun</text>
  <!-- tagline entrance: one-shot fade-in + lift (freeze); decorative only,
       never carries load-bearing info (a lazily-loaded reader may miss it). -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.8s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="0.4s" dur="0.8s" fill="freeze"/>
    <text x="440" y="196" text-anchor="middle" font-size="17" font-weight="500" fill="#6E6E73">probe your GPU · pick quant+backend+template · just run it</text>
  </g>
  <!-- domain-colour pulse point (decorative, infinite loop) -->
  <circle cx="440" cy="232" r="3" fill="#5E5CE6">
    <animate attributeName="opacity" values="0.35;1;0.35" keyTimes="0;0.5;1" dur="2.4s"
             calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
  </circle>
</svg>
